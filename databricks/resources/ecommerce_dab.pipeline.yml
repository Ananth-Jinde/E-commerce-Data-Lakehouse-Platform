resources:
  pipelines:
    ecommerce_gold_dlt:
      name: "ecommerce_gold_dlt_pipeline"
      target: "ecommerce_catalog.gold"
      development: true
      continuous: false
      photon: true
      libraries:
        - notebook:
            path: ../src/gold/dim_customer.py
        - notebook:
            path: ../src/gold/dim_product.py
        - notebook:
            path: ../src/gold/dim_date.py
        - notebook:
            path: ../src/gold/dim_product_category.py
        - notebook:
            path: ../src/gold/fact_orders.py
      clusters:
        - label: "default"
          autoscale:
            min_workers: 1
            max_workers: 3
